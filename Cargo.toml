[package]
name = "broly"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Broly — a Discord bot in Rust"
license = "MIT"

[dependencies]
# Discord — poise framework on top of serenity (serenity-next branch)
poise = { git = "https://github.com/serenity-rs/poise", branch = "serenity-next", features = [
    "cache",
    "handle_panics",
] }
# Direct serenity dep for the `unstable` feature (sync_id for Spotify track links)
serenity = { git = "https://github.com/serenity-rs/serenity", branch = "next", default-features = false, features = [
    "unstable",
] }

# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

# Database
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "uuid",
] }

# HTTP client (for weather API etc.)
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }

# TLS — explicit provider install needed for serenity next
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Config
dotenvy = "0.15"

# Errors
anyhow = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
